[project]
site_name = "rust-email"
site_description = "Bridge react-email templates to Rust template engines (Askama / Tera / minijinja)"
site_author = "AprilNEA"
#site_url = "https://aprilnea.github.io/rust-email/"

copyright = """
Copyright &copy; 2026 AprilNEA
"""

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "API Reference" = "api.md" },
  { "Supported Syntax" = "syntax.md" },
  { "How It Works" = "how-it-works.md" },
  { "CI Integration" = "ci.md" },
]

[project.theme]
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AprilNEA/rust-email"

[[project.extra.social]]
icon = "fontawesome/brands/npm"
link = "https://www.npmjs.com/package/rust-email"
